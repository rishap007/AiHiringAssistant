services:
  - type: web
    name: aihiringassistant-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HUNAR_API_KEY
        sync: false
      - key: HUNAR_BASE_URL
        value: https://api.voice.hunar.ai/external/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: PEOPLE_SEARCH_PROVIDER
        value: mock
      - key: PEOPLE_SEARCH_API_KEY
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
